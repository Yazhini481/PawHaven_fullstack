<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | PawHaven</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="page-header">

    <div class="container">

        <h1>Join PawHaven 🐾</h1>

        <p>
            Create an account and start making a difference.
        </p>

    </div>

</header>


<main class="section">

    <div class="form-container">

        <div id="successMessage"
             class="success-message">
        </div>


        <form id="registerForm">

            <div class="form-section">

                <h3>Create Your Account</h3>


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           required>

                    <span id="nameError"
                          class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           required>

                    <span id="emailError"
                          class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           class="form-control"
                           pattern="[0-9]{10}"
                           required>

                    <span id="phoneError"
                          class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           required>

                    <span id="passwordError"
                          class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           required>

                    <span id="confirmPasswordError"
                          class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label>
                        Account Type
                    </label>

                        <select id="accountType"
                            class="form-control"
                            required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="user">
                            Pet Adopter
                        </option>

                        <option value="shelter">
                            Shelter / Rescue Organization
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    Create Account

                </button>

            </div>

        </form>


        <p style="text-align:center">

            Already have an account?

            <a href="login.html"
               style="color:#557a61;font-weight:700">

                Login

            </a>

        </p>

    </div>

</main>


<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
